name: CI and Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 2'

permissions:
  contents: read

jobs:
  plugin:
    name: WordPress plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: PHP syntax
        run: find plugin/lanemint -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: node --check plugin/lanemint/assets/js/admin.js
      - name: Build plugin ZIP
        run: cd plugin && zip -r ../lanemint-${{ github.sha }}.zip lanemint -x '*.DS_Store'
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lanemint-plugin
          path: lanemint-${{ github.sha }}.zip
          if-no-files-found: error

  backend:
    name: Telemetry backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
